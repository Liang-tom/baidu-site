<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字母查看站 - 登录后查看专属字母</title>
    <meta
      name="description"
      content="字母查看站提供账号登录服务。登录后即可查看专属字母内容。本站支持百度搜索收录。"
    />
    <meta name="keywords" content="字母查看站,登录查看字母,专属字母,百度搜索" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="/" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>字母查看站</h1>
      <p class="lead">
        这是一个需要账号密码登录的网页。登录成功后，页面会显示一段专属字母。
      </p>

      <section id="login-panel">
        <h2>账号登录</h2>
        <form id="login-form">
          <label for="username">账号</label>
          <input id="username" name="username" type="text" autocomplete="username" required />

          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">登录</button>
          <p id="error" class="error" hidden>账号或密码不正确</p>
        </form>
      </section>

      <section id="secret-panel" hidden>
        <h2>登录成功</h2>
        <p>下面是登录后显示的字母：</p>
        <p id="letters" class="letters"></p>
        <button id="logout" type="button">退出登录</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
